services:

  traefik:
    image: traefik:v3.7
    container_name: "traefik"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker.exposedbydefault=false"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: encurtador
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10

  migrate:
    image: ghcr.io/amacneil/dbmate
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/encurtador?sslmode=disable
    volumes:
      - ./db:/db
    command: up
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.encurtador.rule=Host(`fontes.encurtador`)"
      - "traefik.http.routers.encurtador.entrypoints=web"
      - "traefik.http.services.encurtador.loadbalancer.server.port=3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: